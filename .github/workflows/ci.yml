# CI/CD of the shop app. Runs on every push and pull request.
#   shop:     lint -> tests (Linux, Node 22 + 24) -> Windows quick tests -> build -> release-gate
#   docker:   builds the server image; on main it is published to ghcr.io (CD for cloud/NAS installs)
# The shop computer offers «تحديث متاح» ONLY for a commit whose "release-gate" passed.
# The AI debt checker lives in its own repository (with its own CI).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                        # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Keep the built screens
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with: { name: dist, path: dist, retention-days: 7 }

  windows:
    # the shop computer runs Windows: install + build + the main tests must work there too
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run test:quick
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: elbshmds:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (container starts and is ready)
        run: |
          docker run -d --name app -p 3000:3000 -e APP_PASSWORD=ci-password-123 elbshmds:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/api/ready && exit 0; sleep 2; done
          docker logs app; exit 1
      - name: Publish to ghcr.io (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true          # publishing must never block the shop's update
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag elbshmds:ci $IMG:latest && docker tag elbshmds:ci $IMG:${GITHUB_SHA::12}
          docker push $IMG:latest && docker push $IMG:${GITHUB_SHA::12}

  release-gate:
    # the ONE check the shop computer's updater looks at
    runs-on: ubuntu-latest
    needs: [lint, test, windows]
    if: always()
    steps:
      - name: All shop checks passed?
        run: |
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.windows.result }}" = success ] \
            || { echo "a shop check failed"; exit 1; }
