# Runs the shop server in Docker with its database on a named volume (survives updates/restarts).
# 1. copy .env.example to .env and fill APP_PASSWORD (+ TURSO_URL / TURSO_TOKEN for the online copy)
# 2. docker compose up -d --build        -> http://<this machine>:3000
# Pre-built image from GitHub instead of building: replace "build: ." with
#   image: ghcr.io/mazenalhadidy/elbshmds:latest
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports: ["3000:3000"]
    volumes: ["shop-data:/data"]
    stop_grace_period: 15s          # time for the last Turso push on shutdown
volumes:
  shop-data:
