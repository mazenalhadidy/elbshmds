<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدقق الديون</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدقق الديون">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/jszip.min.js" defer></script>
<script type="module" src="/app.js"></script>
</head>
<body>
<div id="login" class="hide">
  <form class="card" id="loginForm">
    <h2>مدقق الديون</h2>
    <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور">
    <p id="pwErr" class="warnbox hide"></p>
    <div class="acts"><button type="submit">دخول</button></div>
  </form>
</div>
<main>
<div class="top"><h1>مدقق الديون</h1><button class="ghost" id="logout">خروج</button></div>

<section class="card" id="step1">
  <label class="file">
    <input type="file" id="file" accept=".zip,.txt,application/zip,text/plain">
    <span id="fileLabel">ملف المحادثة (.zip)</span>
  </label>
  <p class="or">أو</p>
  <label class="file" id="picsDrop">
    <input type="file" id="pics" accept="image/*" multiple>
    <span id="picsLabel">صور</span>
  </label>
  <textarea id="pasteText" rows="2" placeholder="رسائل منسوخة" aria-label="رسائل منسوخة"></textarea>
  <div class="thumbs" id="thumbs"></div>
  <div class="acts"><button id="usePics" class="hide">احسب</button><button class="ghost hide" id="clearPics">امسح</button></div>
  <p id="err" class="warnbox hide"></p>
  <button class="ghost again" id="again">محادثة أخرى</button>
</section>

<section class="card hide" id="sum" aria-live="polite">
  <div class="note" id="debtLabel">على العميل</div>
  <div class="debt" id="debt">0</div>
  <div class="calc" dir="ltr"><pre id="eq"></pre><div class="calc-total" id="eqTotal"></div></div>
  <pre class="check hide" id="check"></pre>
  <p class="note" id="facts"></p>
  <div class="bar" id="barBox"><i id="prog"></i></div>
  <p class="note" id="progText"></p>
  <div class="acts"><button class="ghost" id="copy">انسخ الحساب</button></div>
</section>

<section class="card hide" id="talk">
  <div class="log" id="log" aria-live="polite"></div>
  <form class="fix" id="ask"><input id="askIn" autocomplete="off" placeholder="صحّح أو اسأل" aria-label="صحّح أو اسأل"><button id="askBtn">أرسل</button></form>
</section>

<section class="hide" id="step3">
  <div class="list-h"><h2>الرسائل</h2><button class="chip" id="allBtn" aria-pressed="false">الكل</button></div>
  <div id="list"></div>
</section>

<details class="card" id="train">
  <summary>ما تعلّمته</summary>
  <ul class="rules" id="rules"></ul>
  <p class="note" id="exN"></p>
  <textarea id="learned" rows="6" class="hide" aria-label="خلاصة التصحيحات"></textarea>
  <p class="note" id="store"></p>
</details>
</main>
<div id="zoom" role="dialog" aria-label="الصورة"><img alt="صورة مكبرة"></div>
</body>
</html>
