# Netlify (CD for the AI tool): in Netlify set "Base directory" = ai-tool. Every push to main deploys it,
# but only when something inside ai-tool/ changed (the "ignore" line), so shop-only commits cost no build.
[build]
  publish = "public"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No inline scripts anymore (the code is in app.js/core.js), so scripts are 'self' only.
    # frame-ancestors = sites allowed to show the tool inside them: add the shop laptop (e.g. http://192.168.1.20:*).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'self' http://localhost:* http://127.0.0.1:*"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
